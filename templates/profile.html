{% extends "index.html" %}
{% block content %}
<div class="container mt-5" style="max-width: 600px;">
  <div class="card shadow border-0">
    <div class="card-header bg-primary text-white py-3">
      <h4 class="mb-0 fw-bold"><i class="fas fa-user me-2 text-warning"></i>My Profile</h4>
    </div>
    <div class="card-body p-4 text-center">
      <div class="mb-4">
        {% if user.profile_image %}
          <img src="{{ url_for('static', filename='uploads/profile/' + user.profile_image) }}" alt="Profile" class="rounded-circle border border-3 border-warning shadow" width="120" height="120" style="object-fit: cover;">
        {% else %}
          <div class="rounded-circle bg-warning text-primary d-flex justify-content-center align-items-center mx-auto shadow" style="width: 120px; height: 120px; font-size: 3rem; font-weight: 800;">
            {{ user.username[0]|upper }}
          </div>
        {% endif %}
      </div>
      
      <div class="text-start p-3 bg-light rounded border mb-4">
        <p class="mb-2"><strong><i class="fas fa-id-badge text-primary me-2"></i>Member ID:</strong> <span class="text-dark">{{ user.id }}</span></p>
        <p class="mb-2"><strong><i class="fas fa-user-circle text-primary me-2"></i>Username:</strong> <span class="text-dark">{{ user.username }}</span></p>
        <p class="mb-0"><strong><i class="fas fa-envelope text-primary me-2"></i>Email Address:</strong> <span class="text-dark">{{ user.email }}</span></p>
      </div>
      
      <div class="d-flex justify-content-between">
        <a href="{{ url_for('dashboard') }}" class="btn btn-outline-primary"><i class="fas fa-chevron-left me-2"></i>Back to Dashboard</a>
        <a href="{{ url_for('account_settings') }}" class="btn btn-primary"><i class="fas fa-edit me-2"></i>Edit Settings</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
