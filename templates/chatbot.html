<!-- Floating Button -->
<button
  class="btn btn-primary rounded-circle shadow"
  style="position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; z-index: 9999;"
  data-bs-toggle="modal"
  data-bs-target="#chatbotModal"
>
  💬
</button>

<!-- Modal -->
<div class="modal fade" id="chatbotModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">

      <!-- Header -->
      <div class="modal-header bg-dark text-white">
        <h5 class="modal-title">BuildBot</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <!-- Body -->
      <div class="modal-body d-flex flex-column" style="height: 400px;">

        <!-- Messages -->
        <div id="chatMessages" class="flex-grow-1 overflow-auto mb-3">
          <div class="p-2 bg-light rounded">
            <strong>BuildBot:</strong> Hello 👷‍♂️ How can I help you?
          </div>
        </div>

        <!-- Input -->
        <div class="input-group">
          <input
            type="text"
            id="chatInput"
            class="form-control"
            placeholder="Type your message..."
          >
          <button class="btn btn-primary" id="sendBtn">Send</button>
        </div>

      </div>

    </div>
  </div>
</div>
