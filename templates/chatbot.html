<!-- Floating Button -->
<button
  class="chatbot-trigger"
  data-bs-toggle="modal"
  data-bs-target="#chatbotModal"
  title="Chat with BuildBot"
>
  <i class="fas fa-comments"></i>
</button>

<!-- Modal -->
<div class="modal fade" id="chatbotModal" tabindex="-1" aria-labelledby="chatbotModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <!-- Header -->
      <div class="modal-header">
        <h5 class="modal-title" id="chatbotModalLabel">
          <i class="fas fa-helmet-safety me-2 text-warning"></i>BuildBot Assistant
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <!-- Body -->
      <div class="modal-body d-flex flex-column">

        <!-- Messages Container -->
        <div id="chatMessages" class="flex-grow-1 overflow-auto mb-3" style="height: 350px;">
          <div class="chat-bubble bot">
            <strong>BuildBot:</strong> Hello 👷‍♂️ How can I help you today?
          </div>
        </div>

        <!-- Input Box -->
        <div class="input-group">
          <input
            type="text"
            id="chatInput"
            class="form-control"
            placeholder="Ask about attendance, projects, or materials..."
            aria-label="User Message"
          >
          <button class="btn btn-primary" id="sendBtn">
            <i class="fas fa-paper-plane"></i> Send
          </button>
        </div>

      </div>

    </div>
  </div>
</div>
