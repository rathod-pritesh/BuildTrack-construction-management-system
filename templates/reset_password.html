{% extends "index.html" %}
{% block content %}
<div class="container mt-5" style="max-width: 500px;">
  <div class="card shadow border-0">
    <div class="card-header bg-primary text-white py-3 text-center">
      <h4 class="mb-0 fw-bold"><i class="fas fa-lock me-2 text-warning"></i>Reset Password</h4>
    </div>
    <div class="card-body p-4">
      <p class="text-muted text-center mb-4">Choose a strong, unique password to secure your BuildTrack profile account.</p>
      
      <form method="POST">
        <!-- New Password Field -->
        <div class="mb-3">
          <label for="new_password" class="form-label">New Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-secondary border-end-0"><i class="fas fa-lock"></i></span>
            <input type="password" class="form-control border-start-0 border-end-0" id="new_password" name="new_password" placeholder="••••••••" required>
            <span class="input-group-text bg-white border-start-0">
              <i class="fas fa-eye-slash toggle-password" data-target="#new_password" style="cursor:pointer;"></i>
            </span>
          </div>
        </div>

        <!-- Confirm Password Field -->
        <div class="mb-4">
          <label for="confirm_password" class="form-label">Confirm Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-secondary border-end-0"><i class="fas fa-lock-open"></i></span>
            <input type="password" class="form-control border-start-0 border-end-0" id="confirm_password" name="confirm_password" placeholder="••••••••" required>
            <span class="input-group-text bg-white border-start-0">
              <i class="fas fa-eye-slash toggle-password" data-target="#confirm_password" style="cursor:pointer;"></i>
            </span>
          </div>
        </div>

        <!-- Submit Button -->
        <div class="d-grid">
          <button type="submit" class="btn btn-primary py-2"><i class="fas fa-key me-2"></i>Reset Password</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Toggle Password Script -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const toggles = document.querySelectorAll(".toggle-password");
    toggles.forEach(toggle => {
      toggle.addEventListener("click", function () {
        const input = document.querySelector(this.getAttribute("data-target"));
        const isPassword = input.getAttribute("type") === "password";
        input.setAttribute("type", isPassword ? "text" : "password");
        this.classList.toggle("fa-eye");
        this.classList.toggle("fa-eye-slash");
      });
    });
  });
</script>
{% endblock %}
