{% extends "index.html" %}
{% block content %}
<div class="container mt-5" style="max-width: 600px;">
  <div class="card shadow border-0">
    <div class="card-header bg-primary text-white py-3">
      <h4 class="mb-0 fw-bold"><i class="fas fa-cog me-2 text-warning"></i>Account Settings</h4>
    </div>
    <div class="card-body p-4">
      <form method="POST">
        <div class="mb-4">
          <label for="username" class="form-label">Change Username</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-secondary border-end-0"><i class="fas fa-user"></i></span>
            <input type="text" class="form-control border-start-0" id="username" name="username" value="{{ user.username }}" required>
          </div>
          <div class="form-text text-muted mt-2">Choose a unique username for logging and timesheets.</div>
        </div>
        <div class="d-flex justify-content-between">
          <a href="{{ url_for('dashboard') }}" class="btn btn-outline-primary"><i class="fas fa-chevron-left me-2"></i>Back</a>
          <button type="submit" class="btn btn-primary"><i class="fas fa-save me-2"></i>Update Settings</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
