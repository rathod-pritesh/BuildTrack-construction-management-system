<header class="fixed-top bg-dark">
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('home') }}">BuildTrack</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('home') }}">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('projects') }}">Projects</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('about') }}">About</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('contact') }}">Contact</a>
          </li>
        </ul>
        <div class="d-flex">
          {% if session.get('user_id') %}
            <span class="navbar-text me-3 text-light">Hi, {{ session.get('username') }}</span>
            <a href="{{ url_for('logout') }}" class="btn btn-outline-light">Logout</a>
          {% else %}
            <a href="{{ url_for('login') }}" class="btn btn-outline-light me-2">Login</a>
            <a href="{{ url_for('register') }}" class="btn btn-primary">Register</a>
          {% endif %}
        </div>
      </div>
    </div>
  </nav>
</header>
