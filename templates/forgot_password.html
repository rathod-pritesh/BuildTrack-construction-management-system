{% extends "index.html" %}
{% block content %}
<div class="container mt-5" style="max-width: 500px;">
  <div class="card shadow border-0">
    <div class="card-header bg-primary text-white py-3 text-center">
      <h4 class="mb-0 fw-bold"><i class="fas fa-key me-2 text-warning"></i>Reset Request</h4>
    </div>
    <div class="card-body p-4">
      <p class="text-muted text-center mb-4">Enter your registered email address and we will dispatch a verification OTP code.</p>
      <form method="POST">
        <div class="mb-4">
          <label for="email" class="form-label">Registered Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-secondary border-end-0"><i class="fas fa-envelope"></i></span>
            <input type="email" class="form-control border-start-0" id="email" name="email" placeholder="name@company.com" required>
          </div>
        </div>
        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-primary"><i class="fas fa-paper-plane me-2"></i>Send Verification OTP</button>
          <a href="{{ url_for('login') }}" class="btn btn-outline-primary"><i class="fas fa-chevron-left me-2"></i>Return to Login</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
