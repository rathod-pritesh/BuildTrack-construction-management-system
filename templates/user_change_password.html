{% extends 'index.html' %}

{% block content %}
<div class="container mt-5" style="max-width: 550px;">
  <div class="card shadow border-0">
    <div class="card-header bg-primary text-white py-3 text-center">
      <h4 class="mb-0 fw-bold"><i class="fas fa-lock me-2 text-warning"></i>Change Password</h4>
    </div>
    <div class="card-body p-4">
      <p class="text-muted text-center mb-4">Please input your current password before configuring a new security key.</p>
      
      <form method="POST" action="{{ url_for('user_change_password') }}">
        <!-- Current Password Field -->
        <div class="mb-3">
          <label for="current_password" class="form-label">Current Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-secondary border-end-0"><i class="fas fa-key"></i></span>
            <input type="password" class="form-control border-start-0 border-end-0" id="current_password" name="current_password" placeholder="••••••••" required>
            <span class="input-group-text bg-white border-start-0" onclick="togglePassword('current_password', this)" style="cursor: pointer;">
              <i class="fas fa-eye"></i>
            </span>
          </div>
        </div>

        <!-- New Password Field -->
        <div class="mb-3">
          <label for="new_password" class="form-label">New Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-secondary border-end-0"><i class="fas fa-lock"></i></span>
            <input type="password" class="form-control border-start-0 border-end-0" id="new_password" name="new_password" placeholder="••••••••" required>
            <span class="input-group-text bg-white border-start-0" onclick="togglePassword('new_password', this)" style="cursor: pointer;">
              <i class="fas fa-eye"></i>
            </span>
          </div>
        </div>

        <!-- Confirm Password Field -->
        <div class="mb-4">
          <label for="confirm_password" class="form-label">Confirm New Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-secondary border-end-0"><i class="fas fa-lock-open"></i></span>
            <input type="password" class="form-control border-start-0 border-end-0" id="confirm_password" name="confirm_password" placeholder="••••••••" required>
            <span class="input-group-text bg-white border-start-0" onclick="togglePassword('confirm_password', this)" style="cursor: pointer;">
              <i class="fas fa-eye"></i>
            </span>
          </div>
        </div>

        <div class="d-flex justify-content-between gap-3 mt-4">
          <a href="{{ url_for('dashboard') }}" class="btn btn-outline-primary w-50"><i class="fas fa-chevron-left me-2"></i>Cancel</a>
          <button type="submit" class="btn btn-primary w-50"><i class="fas fa-save me-2"></i>Update Password</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  function togglePassword(fieldId, iconSpan) {
    const input = document.getElementById(fieldId);
    const icon = iconSpan.querySelector('i');

    if (input.type === "password") {
      input.type = "text";
      icon.classList.remove('fa-eye');
      icon.classList.add('fa-eye-slash');
    } else {
      input.type = "password";
      icon.classList.remove('fa-eye-slash');
      icon.classList.add('fa-eye');
    }
  }
</script>
{% endblock %}
