{% extends "index.html" %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="auth-form col-12 col-sm-10 col-md-8 col-lg-5 p-4 rounded shadow border">
    <div class="text-center mb-4">
      <i class="fas fa-user-shield text-warning fa-3x mb-2"></i>
      <h2 class="fw-bold text-primary">Admin Access</h2>
      <p class="text-muted">Enter administrative credentials</p>
    </div>
    
    <form method="POST" action="{{ url_for('admin.admin_login') }}">
      <div class="mb-3">
        <label for="adminUsername" class="form-label">Username</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-secondary border-end-0"><i class="fas fa-user"></i></span>
          <input type="text" name="username" class="form-control border-start-0" id="adminUsername" placeholder="Admin username" required>
        </div>
      </div>

      <div class="mb-3 position-relative">
        <label for="password" class="form-label">Password</label>
        <div class="input-group position-relative">
          <span class="input-group-text bg-light text-secondary border-end-0"><i class="fas fa-lock"></i></span>
          <input type="password" name="password" class="form-control border-start-0" id="password" placeholder="••••••••" required style="padding-right: 40px;">
          <i class="fas fa-eye-slash toggle-password position-absolute" style="top: 50%; transform: translateY(-50%); right: 15px; cursor: pointer; z-index: 10;"></i>
        </div>
      </div>

      <div class="text-center mt-4">
        <button type="submit" class="btn btn-primary w-100 py-2"><i class="fas fa-sign-in-alt me-2"></i>Access Console</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
