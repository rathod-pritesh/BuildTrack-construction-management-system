{% extends 'index.html' %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="auth-form col-12 col-sm-10 col-md-8 col-lg-5 p-4 rounded shadow border bg-white">
    <div class="text-center mb-4">
      <i class="fas fa-lock text-warning fa-3x mb-2"></i>
      <h2 class="fw-bold text-primary">Change Admin Password</h2>
      <p class="text-muted">Update administrative access credentials</p>
    </div>

    <form method="POST" action="{{ url_for('admin.admin_change_password') }}">
      <!-- Current Password -->
      <div class="mb-3 position-relative">
        <label for="current_password" class="form-label">Current Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-secondary border-end-0"><i class="fas fa-key"></i></span>
          <input type="password" class="form-control border-start-0 border-end-0" id="current_password" name="current_password" placeholder="••••••••" required>
          <span class="input-group-text bg-white border-start-0" onclick="togglePassword('current_password', this)" style="cursor: pointer;">
            <i class="fas fa-eye text-secondary"></i>
          </span>
        </div>
      </div>

      <!-- New Password -->
      <div class="mb-3 position-relative">
        <label for="new_password" class="form-label">New Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-secondary border-end-0"><i class="fas fa-lock"></i></span>
          <input type="password" class="form-control border-start-0 border-end-0" id="new_password" name="new_password" placeholder="••••••••" required>
          <span class="input-group-text bg-white border-start-0" onclick="togglePassword('new_password', this)" style="cursor: pointer;">
            <i class="fas fa-eye text-secondary"></i>
          </span>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="mb-3 position-relative">
        <label for="confirm_password" class="form-label">Confirm New Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-secondary border-end-0"><i class="fas fa-check-double"></i></span>
          <input type="password" class="form-control border-start-0 border-end-0" id="confirm_password" name="confirm_password" placeholder="••••••••" required>
          <span class="input-group-text bg-white border-start-0" onclick="togglePassword('confirm_password', this)" style="cursor: pointer;">
            <i class="fas fa-eye text-secondary"></i>
          </span>
        </div>
      </div>

      <div class="text-center mt-4">
        <button type="submit" class="btn btn-primary w-100 py-2"><i class="fas fa-save me-2"></i>Update Password</button>
      </div>
      
      <div class="text-center mt-3">
        <a href="{{ url_for('admin.admin_dashboard') }}" class="text-decoration-none text-secondary small hover-underline">
          <i class="fas fa-arrow-left me-1"></i>Cancel and Return
        </a>
      </div>
    </form>
  </div>
</div>

<!-- Toggle Password Script -->
<script>
  function togglePassword(fieldId, iconSpan) {
    const input = document.getElementById(fieldId);
    const icon = iconSpan.querySelector('i');

    if (input.type === "password") {
      input.type = "text";
      icon.classList.remove('fa-eye');
      icon.classList.add('fa-eye-slash');
    } else {
      input.type = "password";
      icon.classList.remove('fa-eye-slash');
      icon.classList.add('fa-eye');
    }
  }
</script>
{% endblock %}
