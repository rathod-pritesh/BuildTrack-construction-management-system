{% extends "index.html" %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="auth-form col-12 col-sm-10 col-md-8 col-lg-5 p-4 rounded shadow border">
    <div class="text-center mb-4">
      <i class="fas fa-user-plus text-warning fa-3x mb-2"></i>
      <h2 class="fw-bold text-primary">Member Registration</h2>
      <p class="text-muted">Register to start tracking construction shifts</p>
    </div>

    <form id="registerForm" action="{{ url_for('register') }}" method="POST">
      <div class="mb-3">
        <label for="registerUsername" class="form-label">Username</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-secondary border-end-0"><i class="fas fa-user"></i></span>
          <input type="text" class="form-control border-start-0" id="registerUsername" name="username" placeholder="e.g. JohnDoe" required>
        </div>
      </div>

      <div class="mb-3">
        <label for="registerEmail" class="form-label">Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-secondary border-end-0"><i class="fas fa-envelope"></i></span>
          <input type="email" class="form-control border-start-0" id="registerEmail" name="email" placeholder="name@company.com" required>
        </div>
      </div>

      <div class="mb-3 position-relative">
        <label for="registerPassword" class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-secondary border-end-0"><i class="fas fa-lock"></i></span>
          <input type="password" id="registerPassword" class="form-control border-start-0 border-end-0" name="password" placeholder="Min. 8 characters" required>
          <span class="input-group-text bg-white border-start-0"><i class="fas fa-eye-slash toggle-password"></i></span>
        </div>
      </div>

      <div class="mb-3 position-relative">
        <label for="registerConfirmPassword" class="form-label">Confirm Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-secondary border-end-0"><i class="fas fa-lock-open"></i></span>
          <input type="password" id="registerConfirmPassword" class="form-control border-start-0 border-end-0" name="confirmpassword" placeholder="Re-type password" required>
          <span class="input-group-text bg-white border-start-0"><i class="fas fa-eye-slash toggle-password"></i></span>
        </div>
      </div>

      <div class="p-3 bg-light rounded mb-4 border border-light">
        <p class="form-text text-muted mb-0" style="font-size: 0.85rem; line-height: 1.45;">
          <i class="fas fa-info-circle text-primary me-1"></i>Password must be at least <strong>8 characters</strong> long, containing at least <strong>one special character</strong> and <strong>one number</strong>.
        </p>
      </div>

      <div class="text-center">
        <button type="submit" class="btn btn-primary w-100 py-2"><i class="fas fa-user-plus me-2"></i>Request Registration</button>
      </div>
    </form>
    
    <div class="text-center mt-4 pt-3 border-top">
      <p class="mb-0 text-muted">Already have an account? <a href="{{ url_for('login') }}" class="text-primary fw-bold text-decoration-none">Login here</a></p>
    </div>
  </div>
</div>
{% endblock %}
